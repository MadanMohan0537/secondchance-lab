name: Recovery contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Prove the resilient checkout contract
        run: npm run dev -- run examples/checkout.recovery.yml --adapter resilient --out .secondchance/checkout-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-report
          path: .secondchance/checkout-report.md
